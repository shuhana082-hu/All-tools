# apkora-workflow v1
name: Apkora Build
on:
  workflow_dispatch:
    inputs:
      task:
        description: Gradle tasks
        required: false
        default: assembleDebug
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build
        env:
          TASK: ${{ github.event.inputs.task || 'assembleDebug' }}
        run: |
          set +e
          echo "=== APKORA BUILD START ==="
          ROOT=$(find . -maxdepth 3 \( -name settings.gradle -o -name settings.gradle.kts \) -not -path "*/node_modules/*" | head -1)
          if [ -z "$ROOT" ]; then
            echo "NOT_GRADLE: no settings.gradle or settings.gradle.kts found in this repository"
            echo "=== APKORA BUILD END (2) ==="
            exit 2
          fi
          cd "$(dirname "$ROOT")"
          echo "Project folder: $(pwd)"
          if [ -f gradlew ]; then chmod +x gradlew; CMD="./gradlew"; else CMD="gradle"; fi
          echo "Using: $CMD"
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then yes | timeout 120 "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1; fi
          $CMD $TASK --no-daemon --stacktrace 2>&1
          code=$?
          echo "=== APKORA BUILD END ($code) ==="
          exit $code
      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            **/build/outputs/apk/**/*.apk
            **/build/outputs/bundle/**/*.aab
          if-no-files-found: ignore
